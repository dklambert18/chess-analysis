<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    /* Matches stats.html: dark slate, serif headings, letter-spaced labels. */
    @font-face {
      font-family: "Newsreader";
      src: url("fonts/newsreader.woff2") format("woff2");
      font-weight: 200 800;
    }
    :root {
      color-scheme: dark;
      --bg: #14181c;
      --raised: #1c2228;
      --rule: #2c3440;
      --text: #99aabb;
      --bright: #ffffff;
      --muted: #678;
      --accent: #00e054;
      --win: #2b9bd1;
      --draw: #5d6874;
      --loss: #e06f00;
      --error: #ff6b6b;
      --serif: "Newsreader", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body { width: 360px; margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: 0; padding: 0; }
    button:disabled { opacity: .5; cursor: default; }

    .top { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--rule); }
    .top img { width: 20px; height: 20px; image-rendering: pixelated; }
    .top h1 { flex: 1; margin: 0; font: 500 19px/1 var(--serif); color: var(--bright); }
    .text-btn { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .text-btn:hover:not(:disabled) { color: var(--accent); }

    .controls { padding: 14px 16px 0; }
    .row { display: flex; gap: 6px; }
    .row input { flex: 1; min-width: 0; padding: 7px 10px; background: var(--raised); border: 1px solid var(--rule); border-radius: 4px; }
    .row input:focus { outline: none; border-color: var(--muted); }
    .row input::placeholder { color: var(--muted); }
    #loadBtn { padding: 0 12px; background: var(--rule); border-radius: 4px; color: var(--bright); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    #loadBtn:hover:not(:disabled) { background: #3b4553; }

    #currentGame { display: none; width: 100%; margin-top: 10px; padding: 9px; border-radius: 4px; background: var(--accent); color: #14181c; font-weight: 700; }
    #currentGame:hover:not(:disabled) { filter: brightness(1.1); }

    .section-head { display: flex; align-items: center; gap: 10px; margin: 18px 16px 4px; }
    .section-head .line { flex: 1; height: 1px; background: var(--rule); }
    #month { appearance: none; background: none; border: 0; padding: 0 14px 0 0; cursor: pointer;
      font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--text);
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: right 4px center, right 0 center; background-size: 4px 4px; background-repeat: no-repeat; }
    #month:hover:not(:disabled) { color: var(--bright); }
    #month option { background: var(--raised); color: var(--bright); text-transform: none; letter-spacing: 0; }

    #status { min-height: 18px; margin: 6px 16px 0; font-size: 12px; color: var(--muted); }
    #status:empty { display: none; }
    #status.error { color: var(--error); }

    #games { list-style: none; margin: 4px 0 0; padding: 0 0 8px; max-height: 360px; overflow-y: auto; }
    #games li { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px; padding: 9px 16px; border-top: 1px solid var(--rule); }
    #games li:first-child { border-top: 0; }
    #games li:hover { background: var(--raised); }
    .result { font: 500 15px/1 var(--serif); color: var(--bright); text-align: center; }
    .result::after { content: ""; display: block; height: 3px; margin: 5px 4px 0; border-radius: 2px; background: var(--swatch); }
    .opponent { color: var(--bright); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .opponent .rating { color: var(--muted); font-weight: 400; margin-left: 4px; }
    .meta { font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="top">
    <img src="icons/icon32.png" alt="">
    <h1>Your games</h1>
    <button id="statsBtn" class="text-btn">Stats →</button>
  </div>
  <div class="controls">
    <div class="row">
      <input id="chessUsername" autocomplete="username" placeholder="Chess.com username" aria-label="Chess.com username">
      <button id="loadBtn">Go</button>
    </div>
    <button id="currentGame">Analyze the game in this tab</button>
  </div>
  <div class="section-head">
    <select id="month" disabled aria-label="Month"></select>
    <div class="line"></div>
  </div>
  <p id="status" role="status"></p>
  <ul id="games"></ul>
  <script src="chesscom.js"></script>
  <script src="popup.js"></script>
</body>
</html>
