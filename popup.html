<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; padding: 12px; font-family: sans-serif; font-size: 13px; }
    h3 { margin-top: 0; display: flex; align-items: center; gap: 8px; }
    h3 img { width: 32px; height: 32px; image-rendering: pixelated; }
    label { display: block; margin: 9px 0 3px; font-size: 12px; font-weight: 600; }
    input, select, button { box-sizing: border-box; padding: 7px; font-size: 13px; }
    .row { display: flex; gap: 6px; }
    .row input, .row select { flex: 1; min-width: 0; }
    button { cursor: pointer; }
    #currentGame { width: 100%; margin-top: 10px; display: none; }
    #statsBtn { width: 100%; margin-top: 8px; }
    #status { min-height: 18px; font-size: 12px; line-height: 1.35; }
    #games { list-style: none; margin: 8px 0 0; padding: 0; max-height: 340px; overflow-y: auto; }
    #games li { display: flex; align-items: center; gap: 8px; padding: 6px 2px; border-bottom: 1px solid #ddd; }
    #games .info { flex: 1; min-width: 0; }
    #games .opponent { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #games .meta { color: #666; font-size: 11px; }
    .win { color: #2e7d32; } .loss { color: #c62828; } .draw { color: #666; }
  </style>
</head>
<body>
  <h3><img src="icons/icon128.png" alt="">Chess.com → Lichess</h3>
  <label for="chessUsername">Chess.com username</label>
  <div class="row">
    <input id="chessUsername" autocomplete="username" placeholder="Your Chess.com username">
    <button id="loadBtn">Load</button>
  </div>
  <button id="currentGame">Analyze the game in this tab</button>
  <button id="statsBtn">View my stats</button>
  <label for="month">Month</label>
  <select id="month" disabled style="width: 100%"></select>
  <p id="status" role="status"></p>
  <ul id="games"></ul>
  <script src="chesscom.js"></script>
  <script src="popup.js"></script>
</body>
</html>
